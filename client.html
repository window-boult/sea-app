<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency SOS Caller</title>
  
  <!-- PeerJS for Instant Device-to-Device WebRTC Connection -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --purple: #1a002c;
      --light-purple: #3a005f;
      --green: #00e676;
      --red: #ff1744;
      --yellow: #ffea00;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--purple);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .client-card {
      background: #0d0017;
      padding: 24px;
      border-radius: 20px;
      border: 2px solid var(--light-purple);
      text-align: center;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .sos-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 5px solid #fff;
      background: radial-gradient(circle, #ff5252 0%, var(--red) 100%);
      color: white;
      font-weight: 900;
      font-size: 2.5rem;
      cursor: pointer;
      box-shadow: 0 0 30px var(--red);
      margin: 25px auto;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .sos-btn:active { 
      transform: scale(0.93);
      box-shadow: 0 0 10px var(--red);
    }

    .channel-box {
      margin-bottom: 15px;
      background: #1a002c;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--light-purple);
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid var(--light-purple);
      background: #1a002c;
      color: white;
      font-size: 0.95rem;
    }

    .status-text {
      font-weight: bold;
      margin-top: 15px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="client-card">
    <h1 style="color: var(--green); margin: 0 0 5px 0;">EMERGENCY SOS</h1>
    <p style="color: #ccc; margin-top: 0;">Tap button to transmit live GPS coordinates</p>
    
    <div class="channel-box">
      <small style="color:#aaa;">Hospital Code: </small>
      <input type="text" id="roomId" value="hospital-sos-99" style="width: auto; padding: 4px; text-align: center; font-weight: bold;" onchange="initPeer()">
    </div>

    <button class="sos-btn" onclick="sendSOS()">SOS</button>

    <input type="text" id="clientName" placeholder="Full Name">
    <input type="tel" id="clientPhone" placeholder="Phone Number">
    <textarea id="clientNotes" rows="3" placeholder="Medical details / Emergency description"></textarea>

    <div id="clientStatus" class="status-text" style="color: var(--yellow);">Connecting...</div>
  </div>

  <script>
    let peer = null;
    let conn = null;

    function initPeer() {
      if (peer) peer.destroy();
      peer = new Peer();

      peer.on('open', () => {
        const status = document.getElementById('clientStatus');
        status.innerText = "System Ready to Transmit";
        status.style.color = "var(--green)";
      });

      peer.on('error', (err) => {
        const status = document.getElementById('clientStatus');
        status.innerText = "Connection Error. Refresh page.";
        status.style.color = "var(--red)";
      });
    }

    function sendSOS() {
      const status = document.getElementById('clientStatus');
      status.style.color = "var(--yellow)";
      status.innerText = "Retrieving GPS Location...";

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const channelId = document.getElementById('roomId').value.trim();
            status.innerText = "Connecting to Hospital Host...";
            
            conn = peer.connect(channelId);

            conn.on('open', () => {
              const payload = {
                type: 'SOS_ALERT',
                name: document.getElementById('clientName').value || 'Anonymous',
                phone: document.getElementById('clientPhone').value || 'Not provided',
                notes: document.getElementById('clientNotes').value || 'Emergency SOS signal',
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                time: new Date().toLocaleTimeString()
              };
              conn.send(payload);
              status.innerText = "🚨 SOS DISPATCHED TO HOSPITAL!";
              status.style.color = "var(--green)";
            });

            conn.on('data', (data) => {
              if (data.type === 'ACKNOWLEDGED') {
                status.innerText = "✅ Hospital Acknowledged & Help Dispatched!";
              }
            });

            setTimeout(() => {
              if (!conn || !conn.open) {
                status.innerText = "Error: Hospital device offline or incorrect code!";
                status.style.color = "var(--red)";
              }
            }, 6000);
          },
          (err) => {
            alert("Please allow GPS location permission to send emergency alerts!");
            status.innerText = "GPS Access Denied";
            status.style.color = "var(--red)";
          },
          { enableHighAccuracy: true }
        );
      } else {
        alert("Geolocation is not supported by your browser.");
      }
    }

    window.onload = () => initPeer();
  </script>
</body>
</html>
