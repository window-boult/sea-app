<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEA Patient App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Mobile Frame */
    .phone-wrapper {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      max-height: 869px;
      background-color: #000000;
      border-radius: 36px;
      border: 8px solid #2d2d2d;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .status-bar {
      height: 30px;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      font-size: 12px;
      font-weight: 600;
    }

    .app-header {
      height: 56px;
      background-color: #1f1f1f;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #333;
    }

    .app-header img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      margin-right: 12px;
      object-fit: cover;
    }

    .app-header h1 {
      color: #ffffff;
      font-size: 18px;
      font-weight: 500;
    }

    .app-body {
      flex: 1;
      padding: 20px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .sos-button {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff1744 0%, #b71c1c 100%);
      border: 4px solid #ff5252;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 23, 68, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .sos-button:active {
      transform: scale(0.95);
      box-shadow: 0 0 10px rgba(255, 23, 68, 0.4);
    }

    #status-text {
      margin-top: 24px;
      font-size: 14px;
      color: #b0bec5;
      line-height: 1.5;
    }

    .nav-bar {
      height: 30px;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .home-indicator {
      width: 120px;
      height: 4px;
      background-color: #ffffff;
      border-radius: 2px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="phone-wrapper">
    <div class="status-bar">
      <span>9:41</span>
      <span>5G 🔋</span>
    </div>

    <div class="app-header">
      <img src="logo.png" alt="SEA Logo" onerror="this.style.display='none'">
      <h1>SEA Patient App</h1>
    </div>

    <div class="app-body">
      <button class="sos-button" onclick="sendEmergencyAlert()">EMERGENCY<br>SOS</button>
      <div id="status-text">Tap the button to transmit live GPS coordinates to the hospital dashboard.</div>
    </div>

    <div class="nav-bar">
      <div class="home-indicator"></div>
    </div>
  </div>

  <script>
    function sendEmergencyAlert() {
      const statusText = document.getElementById('status-text');
      statusText.innerText = "Requesting location permission...";

      if (!navigator.geolocation) {
        statusText.innerText = "Geolocation is not supported by your device.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const timestamp = new Date().toLocaleTimeString();

          const emergencyData = {
            latitude: lat,
            longitude: lng,
            time: timestamp,
            status: "EMERGENCY ACTIVE"
          };

          // Transmit data to index.html via localStorage
          localStorage.setItem("sea_emergency_signal", JSON.stringify(emergencyData));

          statusText.innerHTML = `<b style="color: #00e676;">ALERT SENT!</b><br>Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}<br>Time: ${timestamp}`;
        },
        (error) => {
          statusText.innerHTML = `<span style="color: #ff5252;">Location access denied or failed.<br>Please enable GPS.</span>`;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }
  </script>
</body>
</html>
