<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEA App - SOS Emergency Attendance</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --purple: #1a002c;
      --light-purple: #3a005f;
      --green: #00e676;
      --red: #ff1744;
      --yellow: #ffea00;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 15px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--purple);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .client-card {
      background: #0d0017;
      padding: 24px;
      border-radius: 20px;
      border: 2px solid var(--light-purple);
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .app-header { text-align: center; margin-bottom: 15px; }
    .app-logo { width: 90px; height: 90px; margin: 0 auto 10px auto; display: block; }
    .app-title { color: var(--green); margin: 0; font-size: 1.8rem; font-weight: 800; }
    .app-subtitle { color: #aaa; margin: 4px 0 0 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }

    .sos-btn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 5px solid #fff;
      background: radial-gradient(circle, #ff5252 0%, var(--red) 100%);
      color: white;
      font-weight: 900;
      font-size: 2.5rem;
      cursor: pointer;
      box-shadow: 0 0 30px var(--red);
      margin: 15px auto;
      display: block;
      transition: transform 0.1s;
    }
    .sos-btn:active { transform: scale(0.93); }

    .call-112-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: var(--red);
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 2px solid #fff;
    }

    .channel-box {
      background: #1a002c;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--light-purple);
      text-align: center;
      margin-bottom: 15px;
    }

    .section-title {
      color: var(--green);
      font-size: 0.95rem;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 5px;
      border-bottom: 1px solid var(--light-purple);
      padding-bottom: 3px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 8px;
      border: 1px solid var(--light-purple);
      background: #1a002c;
      color: white;
      font-size: 0.9rem;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .status-text { font-weight: bold; margin-top: 15px; text-align: center; font-size: 1rem; }
  </style>
</head>
<body>

  <div class="client-card">
    <div class="app-header">
      <svg class="app-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
        <defs>
          <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#3a005f"/>
            <stop offset="100%" stop-color="#0d0017"/>
          </radialGradient>
          <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff1744"/>
            <stop offset="100%" stop-color="#b20000"/>
          </linearGradient>
          <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00e676"/>
            <stop offset="100%" stop-color="#b9f6ca"/>
          </linearGradient>
          <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#bgGrad)" stroke="#3a005f" stroke-width="4"/>
        <path d="M250,70 L360,110 C360,240 250,330 250,350 C250,330 140,240 140,110 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="6" opacity="0.95"/>
        <path d="M120,220 H190 L210,170 L235,260 L265,140 L290,240 L310,220 H380" fill="none" stroke="url(#pulseGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="250" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="70" fill="#00e676" letter-spacing="4" filter="url(#greenGlow)">SEA</text>
      </svg>
      <h1 class="app-title">SEA App</h1>
      <p class="app-subtitle">SOS-Emergency-Attendance</p>
    </div>

    <a href="tel:112" class="call-112-btn">📞 CALL 112 DIRECTLY</a>

    <div class="channel-box">
      <small style="color:#aaa;">Hospital Code: </small>
      <input type="text" id="roomId" value="sea-hospital-99" style="width: auto; padding: 4px; text-align: center; font-weight: bold;" onchange="initPeer()">
    </div>

    <button class="sos-btn" onclick="sendSOS()">SOS</button>

    <div class="section-title">Personal Info</div>
    <div class="grid-2">
      <input type="text" id="clientName" placeholder="Full Name" onchange="saveProfile()">
      <input type="tel" id="clientPhone" placeholder="Phone Number" onchange="saveProfile()">
    </div>

    <div class="section-title">Manual Address / Landmark</div>
    <textarea id="manualAddress" rows="2" placeholder="House/Apt No, Street Name, Floor, Landmark"></textarea>

    <div class="section-title">Medical Profile</div>
    <div class="grid-2">
      <select id="bloodGroup" onchange="saveProfile()">
        <option value="Not Specified">Blood Group</option>
        <option value="A+">A+</option><option value="A-">A-</option>
        <option value="B+">B+</option><option value="B-">B-</option>
        <option value="O+">O+</option><option value="O-">O-</option>
        <option value="AB+">AB+</option><option value="AB-">AB-</option>
      </select>
      <input type="text" id="emergencyContact" placeholder="ICE Contact Phone" onchange="saveProfile()">
    </div>
    <input type="text" id="allergies" placeholder="Known Allergies" onchange="saveProfile()">
    <textarea id="medicalConditions" rows="2" placeholder="Pre-existing Conditions" onchange="saveProfile()"></textarea>

    <div id="clientStatus" class="status-text" style="color: var(--yellow);">Initializing SEA Network...</div>
  </div>

  <script>
    let peer = null;
    let conn = null;
    let watchId = null;
    let retryInterval = null;
    let isConnected = false;

    // Read URL ?id= parameter if available
    const urlParams = new URLSearchParams(window.location.search);
    const urlHospitalId = urlParams.get('id');
    if (urlHospitalId) {
      document.getElementById('roomId').value = urlHospitalId;
    }

    function initPeer() {
      if (peer) peer.destroy();
      
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:global.stun.twilio.com:3478' }
          ]
        },
        debug: 1
      });

      peer.on('open', () => {
        const status = document.getElementById('clientStatus');
        status.innerText = "SEA System Ready to Transmit";
        status.style.color = "var(--green)";
      });

      peer.on('error', (err) => {
        console.warn("PeerJS Warning:", err);
      });
    }

    function saveProfile() {
      const profile = {
        name: document.getElementById('clientName').value,
        phone: document.getElementById('clientPhone').value,
        bloodGroup: document.getElementById('bloodGroup').value,
        emergencyContact: document.getElementById('emergencyContact').value,
        allergies: document.getElementById('allergies').value,
        medicalConditions: document.getElementById('medicalConditions').value
      };
      localStorage.setItem('sea_patient_profile', JSON.stringify(profile));
    }

    function loadProfile() {
      const saved = localStorage.getItem('sea_patient_profile');
      if (saved) {
        const profile = JSON.parse(saved);
        document.getElementById('clientName').value = profile.name || '';
        document.getElementById('clientPhone').value = profile.phone || '';
        document.getElementById('bloodGroup').value = profile.bloodGroup || 'Not Specified';
        document.getElementById('emergencyContact').value = profile.emergencyContact || '';
        document.getElementById('allergies').value = profile.allergies || '';
        document.getElementById('medicalConditions').value = profile.medicalConditions || '';
      }
    }

    function sendSOS() {
      const status = document.getElementById('clientStatus');
      status.style.color = "var(--yellow)";
      status.innerText = "Connecting to Hospital Dashboard...";

      if (retryInterval) clearInterval(retryInterval);
      isConnected = false;

      attemptConnection();
      retryInterval = setInterval(() => {
        if (!isConnected) {
          status.innerText = "⏳ Retrying connection to Hospital...";
          attemptConnection();
        }
      }, 3000);
    }

    function attemptConnection() {
      const channelId = document.getElementById('roomId').value.trim();
      if (!peer || peer.destroyed) initPeer();

      conn = peer.connect(channelId, { reliable: true });

      conn.on('open', () => {
        isConnected = true;
        if (retryInterval) clearInterval(retryInterval);

        const status = document.getElementById('clientStatus');
        status.innerText = "🚨 Connected! Acquiring High-Precision GPS...";
        status.style.color = "var(--green)";

        const sendPayload = (lat, lng, accuracy) => {
          const payload = {
            type: 'SOS_ALERT',
            name: document.getElementById('clientName').value || 'Anonymous Patient',
            phone: document.getElementById('clientPhone').value || 'Not provided',
            manualAddress: document.getElementById('manualAddress').value || 'None specified',
            bloodGroup: document.getElementById('bloodGroup').value,
            allergies: document.getElementById('allergies').value || 'None',
            conditions: document.getElementById('medicalConditions').value || 'None',
            emergencyContact: document.getElementById('emergencyContact').value || 'N/A',
            lat: lat,
            lng: lng,
            accuracy: accuracy,
            time: new Date().toLocaleTimeString()
          };
          if (conn && conn.open) conn.send(payload);
          status.innerText = "🚨 SEA DISTRESS TRANSMITTED (GPS Active)";
        };

        // Fallback transmission immediately
        sendPayload(null, null, null);

        // Start GPS Continuous Tracking
        if ("geolocation" in navigator) {
          if (watchId) navigator.geolocation.clearWatch(watchId);
          
          watchId = navigator.geolocation.watchPosition(
            (pos) => {
              sendPayload(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
            },
            (err) => {
              console.warn("GPS High Accuracy Error, trying standard GPS...", err);
              navigator.geolocation.getCurrentPosition(
                (pos) => sendPayload(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
                (e) => console.log("GPS unavailable")
              );
            },
            {
              enableHighAccuracy: true,
              timeout: 10000,
              maximumAge: 0
            }
          );
        }
      });

      conn.on('data', (data) => {
        if (data.type === 'ACKNOWLEDGED') {
          const status = document.getElementById('clientStatus');
          status.innerText = "✅ Hospital Acknowledged & Dispatch En Route!";
        }
      });

      conn.on('close', () => {
        isConnected = false;
        const status = document.getElementById('clientStatus');
        status.innerText = "⚠️ Signal lost. Reconnecting automatically...";
        status.style.color = "var(--yellow)";
        sendSOS();
      });
    }

    window.onload = () => {
      loadProfile();
      initPeer();
    };
  </script>
</body>
</html>
