<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Link Manifest -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a002c">

<!-- Register Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registered!', reg))
        .catch(err => console.error('Service Worker failed:', err));
    });
  }
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEA App - SOS Emergency Attendance</title>
  
  <!-- PeerJS for WebRTC Connection -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --purple: #1a002c;
      --light-purple: #3a005f;
      --green: #00e676;
      --red: #ff1744;
      --yellow: #ffea00;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 15px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--purple);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .client-card {
      background: #0d0017;
      padding: 24px;
      border-radius: 20px;
      border: 2px solid var(--light-purple);
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .app-header {
      text-align: center;
      margin-bottom: 15px;
    }

    .app-logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 10px auto;
      display: block;
    }

    .app-title {
      color: var(--green);
      margin: 0;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .app-subtitle {
      color: #aaa;
      margin: 4px 0 0 0;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sos-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 5px solid #fff;
      background: radial-gradient(circle, #ff5252 0%, var(--red) 100%);
      color: white;
      font-weight: 900;
      font-size: 2.5rem;
      cursor: pointer;
      box-shadow: 0 0 30px var(--red);
      margin: 15px auto;
      display: block;
      transition: transform 0.1s;
    }
    .sos-btn:active { transform: scale(0.93); }

    .call-112-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: var(--red);
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 2px solid #fff;
    }

    .channel-box {
      background: #1a002c;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--light-purple);
      text-align: center;
      margin-bottom: 15px;
    }

    .section-title {
      color: var(--green);
      font-size: 0.95rem;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 5px;
      border-bottom: 1px solid var(--light-purple);
      padding-bottom: 3px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 8px;
      border: 1px solid var(--light-purple);
      background: #1a002c;
      color: white;
      font-size: 0.9rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #ccc;
      margin: 10px 0;
    }

    .status-text {
      font-weight: bold;
      margin-top: 15px;
      text-align: center;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="client-card">
    <!-- Embedded Header Logo -->
    <div class="app-header">
      <svg class="app-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
        <defs>
          <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#3a005f"/>
            <stop offset="100%" stop-color="#0d0017"/>
          </radialGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
          <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff1744"/>
            <stop offset="100%" stop-color="#b20000"/>
          </linearGradient>
          <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00e676"/>
            <stop offset="100%" stop-color="#b9f6ca"/>
          </linearGradient>
        </defs>
        <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#bgGrad)" stroke="#3a005f" stroke-width="4"/>
        <path d="M250,90 L360,130 C360,260 250,350 250,370 C250,350 140,260 140,130 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="6" opacity="0.95" filter="url(#glow)"/>
        <path d="M230,170 H270 V210 H310 V250 H270 V290 H230 V250 H190 V210 H230 Z" fill="#ffffff" opacity="0.25"/>
        <path d="M120,240 H190 L210,190 L235,280 L265,160 L290,260 L310,240 H380" fill="none" stroke="url(#pulseGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      </svg>
      <h1 class="app-title">SEA App</h1>
      <p class="app-subtitle">SOS-Emergency-Attendance</p>
    </div>

    <!-- Direct 112 Call Button -->
    <a href="tel:112" class="call-112-btn">📞 CALL 112 DIRECTLY</a>

    <div class="channel-box">
      <small style="color:#aaa;">Hospital Code: </small>
      <input type="text" id="roomId" value="sea-hospital-99" style="width: auto; padding: 4px; text-align: center; font-weight: bold;" onchange="initPeer()">
    </div>

    <!-- SOS Trigger Button -->
    <button class="sos-btn" onclick="sendSOS()">SOS</button>

    <div class="checkbox-container">
      <input type="checkbox" id="autoCall112" style="width:auto; margin:0;">
      <label for="autoCall112">Automatically open 112 dialer when SOS is pressed</label>
    </div>

    <!-- Patient Basic Info -->
    <div class="section-title">Personal Info</div>
    <div class="grid-2">
      <input type="text" id="clientName" placeholder="Full Name" onchange="saveProfile()">
      <input type="tel" id="clientPhone" placeholder="Phone Number" onchange="saveProfile()">
    </div>

    <!-- Location & Address Details -->
    <div class="section-title">Manual Address / Landmark (Optional)</div>
    <textarea id="manualAddress" rows="2" placeholder="House/Apt No, Street Name, Floor, Landmark (helps if GPS is inaccurate)"></textarea>

    <!-- Detailed Medical Profile -->
    <div class="section-title">Medical Profile (Saved locally)</div>
    <div class="grid-2">
      <select id="bloodGroup" onchange="saveProfile()">
        <option value="Not Specified">Select Blood Group</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
      </select>
      <input type="text" id="emergencyContact" placeholder="ICE Contact / Relative Phone" onchange="saveProfile()">
    </div>
    <input type="text" id="allergies" placeholder="Known Allergies (e.g., Penicillin, Peanuts)" onchange="saveProfile()">
    <textarea id="medicalConditions" rows="2" placeholder="Pre-existing Conditions (e.g., Asthma, Diabetes, Heart Disease)" onchange="saveProfile()"></textarea>

    <div id="clientStatus" class="status-text" style="color: var(--yellow);">Connecting...</div>
  </div>

  <script>
    let peer = null;
    let conn = null;

    function initPeer() {
      if (peer) peer.destroy();
      peer = new Peer();

      peer.on('open', () => {
        const status = document.getElementById('clientStatus');
        status.innerText = "SEA System Ready to Transmit";
        status.style.color = "var(--green)";
      });

      peer.on('error', (err) => {
        const status = document.getElementById('clientStatus');
        status.innerText = "Connection Error. Refresh app.";
        status.style.color = "var(--red)";
      });
    }

    function saveProfile() {
      const profile = {
        name: document.getElementById('clientName').value,
        phone: document.getElementById('clientPhone').value,
        bloodGroup: document.getElementById('bloodGroup').value,
        emergencyContact: document.getElementById('emergencyContact').value,
        allergies: document.getElementById('allergies').value,
        medicalConditions: document.getElementById('medicalConditions').value
      };
      localStorage.setItem('sea_patient_profile', JSON.stringify(profile));
    }

    function loadProfile() {
      const saved = localStorage.getItem('sea_patient_profile');
      if (saved) {
        const profile = JSON.parse(saved);
        document.getElementById('clientName').value = profile.name || '';
        document.getElementById('clientPhone').value = profile.phone || '';
        document.getElementById('bloodGroup').value = profile.bloodGroup || 'Not Specified';
        document.getElementById('emergencyContact').value = profile.emergencyContact || '';
        document.getElementById('allergies').value = profile.allergies || '';
        document.getElementById('medicalConditions').value = profile.medicalConditions || '';
      }
    }

    function sendSOS() {
      const status = document.getElementById('clientStatus');
      status.style.color = "var(--yellow)";
      status.innerText = "Retrieving GPS Location...";

      if (document.getElementById('autoCall112').checked) {
        window.location.href = "tel:112";
      }

      const transmitData = (lat = null, lng = null) => {
        const channelId = document.getElementById('roomId').value.trim();
        status.innerText = "Transmitting to Hospital...";
        
        conn = peer.connect(channelId);

        conn.on('open', () => {
          const payload = {
            type: 'SOS_ALERT',
            name: document.getElementById('clientName').value || 'Anonymous',
            phone: document.getElementById('clientPhone').value || 'Not provided',
            manualAddress: document.getElementById('manualAddress').value || 'None specified',
            bloodGroup: document.getElementById('bloodGroup').value,
            allergies: document.getElementById('allergies').value || 'None',
            conditions: document.getElementById('medicalConditions').value || 'None',
            emergencyContact: document.getElementById('emergencyContact').value || 'N/A',
            lat: lat,
            lng: lng,
            time: new Date().toLocaleTimeString()
          };
          conn.send(payload);
          status.innerText = "🚨 SEA EMERGENCY DISPATCHED!";
          status.style.color = "var(--green)";
        });

        conn.on('data', (data) => {
          if (data.type === 'ACKNOWLEDGED') {
            status.innerText = "✅ Hospital Acknowledged & Help Dispatched!";
          }
        });

        setTimeout(() => {
          if (!conn || !conn.open) {
            status.innerText = "Error: Hospital device offline or incorrect code!";
            status.style.color = "var(--red)";
          }
        }, 6000);
      };

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => transmitData(pos.coords.latitude, pos.coords.longitude),
          (err) => {
            status.innerText = "GPS unavailable. Transmitting manual data...";
            transmitData(null, null);
          },
          { enableHighAccuracy: true, timeout: 5000 }
        );
      } else {
        transmitData(null, null);
      }
    }

    window.onload = () => {
      loadProfile();
      initPeer();
    };
  </script>
</body>
</html>
