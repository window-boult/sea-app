name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Web Project Structure
        run: |
          mkdir -p android-project/app/src/main/assets/public
          cp -r index.html manifest.json sw.js icon-192.png icon-512.png android-project/app/src/main/assets/public/ || true

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Build APK via Cordova
        run: |
          cordova create seaApp com.sea.emergency "SEA Emergency"
          cd seaApp
          cp -r ../index.html ../manifest.json ../sw.js ../icon-192.png ../icon-512.png www/
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEA-App-APK
          path: seaApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
