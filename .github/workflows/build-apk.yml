name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Key & Build APK
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=SEA, OU=App, O=SEA, L=City, S=State, C=US"
          npx @bubblewrap/cli build --signingKeyPath=./android.keystore --signingKeyAlias=android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEA-App-Debug-APK
          path: ./*.apk
