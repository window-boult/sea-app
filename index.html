<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEA System - SOS Emergency Attendance</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --purple: #1a002c;
      --light-purple: #3a005f;
      --green: #00e676;
      --red: #ff1744;
      --yellow: #ffea00;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 15px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--purple);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Pill Navigation Bar */
    .nav-pill-container {
      background: #0d0017;
      border: 1px solid var(--light-purple);
      padding: 4px;
      border-radius: 30px;
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .nav-pill {
      padding: 8px 18px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: #aaa;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }
    .nav-pill.active {
      background: var(--light-purple);
      color: var(--green);
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
    }

    /* App Header Logo */
    .app-header { text-align: center; margin-bottom: 10px; }
    .app-logo { width: 80px; height: 80px; margin: 0 auto 5px auto; display: block; }
    .app-title { color: var(--green); margin: 0; font-size: 1.6rem; font-weight: 900; }
    .app-subtitle { color: #aaa; margin: 2px 0 15px 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }

    /* Common Card Container */
    .view-card {
      width: 100%;
      max-width: 450px;
      background: #0d0017;
      padding: 20px;
      border-radius: 20px;
      border: 2px solid var(--light-purple);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .view-card.wide { max-width: 1000px; }

    /* SOS Button */
    .sos-btn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 5px solid #fff;
      background: radial-gradient(circle, #ff5252 0%, var(--red) 100%);
      color: white;
      font-weight: 900;
      font-size: 2.4rem;
      cursor: pointer;
      box-shadow: 0 0 30px var(--red);
      margin: 15px auto;
      display: block;
      transition: transform 0.1s;
    }
    .sos-btn:active { transform: scale(0.93); }

    /* Login Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .login-card {
      background: #0d0017;
      padding: 25px;
      border-radius: 16px;
      border: 2px solid var(--green);
      width: 90%;
      max-width: 350px;
      text-align: center;
    }

    /* Hospital UI */
    .hospital-header {
      background: var(--light-purple);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid var(--green);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .siren-active { animation: flashSiren 0.5s infinite alternate; }
    @keyframes flashSiren {
      0% { background-color: var(--light-purple); box-shadow: 0 0 10px var(--green); }
      100% { background-color: #990000; box-shadow: 0 0 40px var(--red); }
    }

    .hospital-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }
    @media (min-width: 768px) {
      .hospital-grid { grid-template-columns: 320px 1fr; }
    }

    #map { height: 400px; border-radius: 12px; border: 2px solid var(--green); }

    /* Forms */
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 8px;
      border: 1px solid var(--light-purple);
      background: #1a002c;
      color: white;
      font-size: 0.9rem;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .badge { background: var(--red); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }
    .status-box { text-align: center; font-weight: bold; margin-top: 10px; font-size: 0.95rem; color: var(--yellow); }
    .call-112-btn {
      display: block; width: 100%; padding: 10px; background: var(--red); color: white;
      text-align: center; text-decoration: none; font-weight: bold; border-radius: 8px; margin-bottom: 10px; border: 1px solid #fff;
    }
  </style>
</head>
<body>

  <!-- TOP PILL NAVIGATION -->
  <div class="nav-pill-container">
    <button id="pillPatient" class="nav-pill active" onclick="switchView('patient')">📱 Patient App</button>
    <button id="pillHospital" class="nav-pill" onclick="switchView('hospital')">🏥 Hospital Dashboard</button>
  </div>

  <!-- PATIENT PORTAL (DEFAULT VIEW) -->
  <div id="patientCard" class="view-card">
    <div class="app-header">
      <svg class="app-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
        <defs>
          <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#3a005f"/>
            <stop offset="100%" stop-color="#0d0017"/>
          </radialGradient>
          <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff1744"/>
            <stop offset="100%" stop-color="#b20000"/>
          </linearGradient>
          <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00e676"/>
            <stop offset="100%" stop-color="#b9f6ca"/>
          </linearGradient>
          <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#bgGrad)" stroke="#3a005f" stroke-width="4"/>
        <path d="M250,70 L360,110 C360,240 250,330 250,350 C250,330 140,240 140,110 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="6" opacity="0.95"/>
        <path d="M120,220 H190 L210,170 L235,260 L265,140 L290,240 L310,220 H380" fill="none" stroke="url(#pulseGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="250" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="70" fill="#00e676" letter-spacing="4" filter="url(#greenGlow)">SEA</text>
      </svg>
      <h1 class="app-title">SEA App</h1>
      <p class="app-subtitle">SOS Emergency Attendance</p>
    </div>

    <a href="tel:112" class="call-112-btn">📞 CALL 112 DIRECTLY</a>

    <div style="background:#1a002c; padding:8px; border-radius:8px; border:1px solid var(--light-purple); margin-bottom:10px; text-align:center;">
      <small style="color:#aaa;">Hospital Target Code: </small>
      <input type="text" id="hospitalIdInput" value="sea-hospital-99" style="width:auto; padding:3px 6px; text-align:center; font-weight:bold;">
    </div>

    <button class="sos-btn" onclick="triggerSOS()">SOS</button>

    <div class="grid-2">
      <input type="text" id="pName" placeholder="Full Name">
      <input type="tel" id="pPhone" placeholder="Phone Number">
    </div>
    <textarea id="pAddress" rows="2" placeholder="Manual Address / Landmark"></textarea>
    
    <div class="grid-2">
      <select id="pBlood">
        <option value="Unknown">Select Blood Group</option>
        <option value="O+">O+</option><option value="O-">O-</option>
        <option value="A+">A+</option><option value="A-">A-</option>
        <option value="B+">B+</option><option value="B-">B-</option>
        <option value="AB+">AB+</option><option value="AB-">AB-</option>
      </select>
      <input type="text" id="pICE" placeholder="Emergency Contact (ICE)">
    </div>
    <input type="text" id="pAllergies" placeholder="Known Allergies">
    <textarea id="pConditions" rows="2" placeholder="Medical Conditions"></textarea>

    <div id="patientStatus" class="status-box">System Ready</div>
  </div>

  <!-- HOSPITAL LOGIN MODAL -->
  <div id="loginModal" class="modal-overlay">
    <div class="login-card">
      <h3 style="color:var(--green); margin-top:0;">Hospital Login</h3>
      <input type="text" id="loginUser" placeholder="Username">
      <input type="password" id="loginPass" placeholder="Password">
      <p id="loginError" style="color:var(--red); font-size:0.85rem; display:none;">Invalid credentials!</p>
      <div style="margin-top:15px; display:flex; gap:8px;">
        <button style="flex:1; padding:10px; background:var(--green); border:none; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="verifyLogin()">Login</button>
        <button style="flex:1; padding:10px; background:#444; color:white; border:none; border-radius:6px; cursor:pointer;" onclick="switchView('patient')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- HOSPITAL DASHBOARD VIEW -->
  <div id="hospitalCard" class="view-card wide" style="display:none;">
    <div class="hospital-header" id="sirenHeader">
      <div>
        <h2 style="margin:0; color:var(--green);">SEA Control Unit</h2>
        <small id="hospitalIDDisplay">Listening Code: sea-hospital-99</small>
        <div id="hStatus" style="font-weight:bold; margin-top:4px;">Status: Online & Listening</div>
      </div>
      <button style="background:var(--green); border:none; padding:10px 18px; font-weight:bold; border-radius:8px; cursor:pointer;" onclick="stopSiren()">ACKNOWLEDGE & STOP SIREN</button>
    </div>

    <div class="hospital-grid">
      <div style="background:#0d0017; border:1px solid var(--light-purple); padding:15px; border-radius:12px; overflow-y:auto; max-height:450px;">
        <h3 style="color:var(--green); margin-top:0;">Live Emergency Data</h3>
        <div id="alertDetails"><p style="color:#888;">Waiting for live SOS signals...</p></div>
      </div>
      <div id="map"></div>
    </div>
  </div>

  <script>
    const channel = new BroadcastChannel('sea_emergency_network');
    let isAuthenticated = false;
    let map = null, mapMarker = null, accuracyCircle = null;
    let audioCtx = null, oscillator = null, sirenInterval = null;
    let gpsWatchId = null;

    // Switch Tabs via Pill
    function switchView(target) {
      if (target === 'patient') {
        document.getElementById('patientCard').style.display = 'block';
        document.getElementById('hospitalCard').style.display = 'none';
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('pillPatient').classList.add('active');
        document.getElementById('pillHospital').classList.remove('active');
      } else if (target === 'hospital') {
        if (!isAuthenticated) {
          document.getElementById('loginModal').style.display = 'flex';
        } else {
          document.getElementById('patientCard').style.display = 'none';
          document.getElementById('hospitalCard').style.display = 'block';
          document.getElementById('pillHospital').classList.add('active');
          document.getElementById('pillPatient').classList.remove('active');
          initMap();
        }
      }
    }

    function verifyLogin() {
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value.trim();

      if (u === "skim hospital" && p === "skim123") {
        isAuthenticated = true;
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('patientCard').style.display = 'none';
        document.getElementById('hospitalCard').style.display = 'block';
        document.getElementById('pillHospital').classList.add('active');
        document.getElementById('pillPatient').classList.remove('active');
        initMap();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    // Precise SOS Transmitter with Fallback Checks
    function triggerSOS() {
      const status = document.getElementById('patientStatus');
      status.innerText = "🚨 Transmitting Distress Signal & Acquiring GPS...";
      status.style.color = "var(--yellow)";

      const targetId = document.getElementById('hospitalIdInput').value.trim();

      // Retrieve form values with fallback checks
      const nameVal = document.getElementById('pName').value.trim() || "Unknown";
      const phoneVal = document.getElementById('pPhone').value.trim() || "Not Provided";
      const addressVal = document.getElementById('pAddress').value.trim() || "Not Provided";
      const bloodVal = document.getElementById('pBlood').value || "Unknown";
      const iceVal = document.getElementById('pICE').value.trim() || "Not Provided";
      const allergiesVal = document.getElementById('pAllergies').value.trim() || "None Listed";
      const conditionsVal = document.getElementById('pConditions').value.trim() || "None Listed";

      const sendPayload = (lat, lng, accuracy) => {
        const payload = {
          type: 'SOS_ALERT',
          targetHospitalId: targetId,
          name: nameVal,
          phone: phoneVal,
          address: addressVal,
          blood: bloodVal,
          ice: iceVal,
          allergies: allergiesVal,
          conditions: conditionsVal,
          lat: lat,
          lng: lng,
          accuracy: accuracy,
          time: new Date().toLocaleTimeString()
        };
        
        // Channel transmission + localStorage backup
        channel.postMessage(payload);
        localStorage.setItem('sea_last_sos_event', JSON.stringify(payload));
        
        status.innerText = "🚨 DISTRESS TRANSMITTED LIVE TO HOSPITAL!";
        status.style.color = "var(--green)";
      };

      // Send initial payload
      sendPayload(null, null, null);

      // Stream high-accuracy GPS
      if ("geolocation" in navigator) {
        if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);

        gpsWatchId = navigator.geolocation.watchPosition(
          (pos) => sendPayload(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
          (err) => {
            navigator.geolocation.getCurrentPosition(
              (pos) => sendPayload(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
              (e) => console.log("GPS unavailable")
            );
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }
    }

    // Hospital Event Handlers
    channel.onmessage = (event) => processEmergencySignal(event.data);
    window.addEventListener('storage', (event) => {
      if (event.key === 'sea_last_sos_event' && event.newValue) {
        processEmergencySignal(JSON.parse(event.newValue));
      }
    });

    function processEmergencySignal(data) {
      if (data && data.type === 'SOS_ALERT') {
        const currentTargetCode = document.getElementById('hospitalIdInput').value.trim();
        if (data.targetHospitalId === currentTargetCode) {
          receiveSOS(data);
        }
      }
    }

    function receiveSOS(data) {
      startSiren();
      document.getElementById('sirenHeader').classList.add('siren-active');
      document.getElementById('hStatus').innerText = "🚨 DISTRESS ALERT RECEIVED!";

      let locationText = data.lat ? 
        `<p><strong>GPS Coordinates:</strong> ${data.lat.toFixed(5)}, ${data.lng.toFixed(5)}</p>
         <p><strong>GPS Accuracy:</strong> <span style="color:var(--green);">±${Math.round(data.accuracy)} meters</span></p>` : 
        `<p style="color:var(--yellow);">⚠️ Acquiring precise GPS satellite fix... (Using manual address below)</p>`;

      document.getElementById('alertDetails').innerHTML = `
        <p><strong>Time:</strong> ${data.time}</p>
        <p><strong>Name:</strong> ${data.name}</p>
        <p><strong>Phone:</strong> ${data.phone}</p>
        <p><strong>Blood Group:</strong> <span class="badge">${data.blood}</span></p>
        <hr style="border-color:var(--light-purple)">
        <p><strong>Address:</strong> ${data.address}</p>
        <p><strong>Allergies:</strong> ${data.allergies}</p>
        <p><strong>Pre-existing Conditions:</strong> ${data.conditions}</p>
        <p><strong>ICE Contact:</strong> ${data.ice}</p>
        <hr style="border-color:var(--light-purple)">
        ${locationText}
      `;

      if (data.lat && map) {
        const coords = [data.lat, data.lng];
        map.setView(coords, 16);

        if (mapMarker) map.removeLayer(mapMarker);
        mapMarker = L.marker(coords).addTo(map).bindPopup(`<b>${data.name}</b>`).openPopup();

        if (accuracyCircle) map.removeLayer(accuracyCircle);
        if (data.accuracy) {
          accuracyCircle = L.circle(coords, { radius: data.accuracy, color: '#00e676', fillColor: '#00e676', fillOpacity: 0.2 }).addTo(map);
        }
      }
    }

    function initMap() {
      if (!map) {
        map = L.map('map').setView([20.5937, 78.9629], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
      }
    }

    function startSiren() {
      if (oscillator) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);

      let toggle = false;
      sirenInterval = setInterval(() => {
        if (!oscillator) return;
        oscillator.frequency.setValueAtTime(toggle ? 600 : 900, audioCtx.currentTime);
        toggle = !toggle;
      }, 400);

      oscillator.connect(gain);
      gain.connect(audioCtx.destination);
      oscillator.start();
    }

    function stopSiren() {
      if (oscillator) { oscillator.stop(); oscillator = null; }
      if (sirenInterval) clearInterval(sirenInterval);
      document.getElementById('sirenHeader').classList.remove('siren-active');
      document.getElementById('hStatus').innerText = "Status: Alert Acknowledged";
    }
  </script>
</body>
</html>
