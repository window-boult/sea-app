<!DOCTYPE html>
<html lang="en">
<head>
      <!-- App Logo & Fullscreen Settings -->
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="logo.svg">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a002c">
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEA Dashboard - SOS Emergency Attendance</title>
  
  <!-- Leaflet Maps CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- PeerJS for WebRTC Connection -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --purple: #1a002c;
      --light-purple: #3a005f;
      --green: #00e676;
      --red: #ff1744;
      --yellow: #ffea00;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 15px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--purple);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hospital-header {
      background: var(--light-purple);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid var(--green);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .header-logo {
      width: 50px;
      height: 50px;
    }

    .header-title-box {
      display: flex;
      flex-direction: column;
    }
    .header-title-box h2 {
      margin: 0;
      color: var(--green);
      font-size: 1.6rem;
    }
    .header-title-box small {
      color: #ccc;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    .siren-active {
      animation: flashSiren 0.5s infinite alternate;
    }
    @keyframes flashSiren {
      0% { background-color: var(--light-purple); box-shadow: 0 0 10px var(--green); }
      100% { background-color: #990000; box-shadow: 0 0 40px var(--red); }
    }

    .btn-stop {
      background: var(--green);
      color: #000;
      font-weight: bold;
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }

    .channel-id-box {
      background: #0d0017;
      border: 1px solid var(--light-purple);
      padding: 8px 12px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 15px;
    }

    .hospital-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      flex: 1;
    }
    @media (min-width: 768px) {
      .hospital-layout { grid-template-columns: 360px 1fr; }
    }

    .details-panel {
      background: #0d0017;
      border: 1px solid var(--light-purple);
      border-radius: 12px;
      padding: 20px;
      overflow-y: auto;
      max-height: 80vh;
    }

    .badge {
      display: inline-block;
      background: var(--red);
      color: white;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    #map {
      height: 100%;
      min-height: 400px;
      border-radius: 12px;
      border: 2px solid var(--green);
    }
  </style>
</head>
<body>

  <!-- Connection ID Setting -->
  <div>
    <div class="channel-id-box">
      <label>SEA Hospital Connection ID: </label>
      <input type="text" id="roomId" value="sea-hospital-99" style="padding:4px 8px; background:#1a002c; color:white; border:1px solid var(--light-purple); border-radius:4px;" onchange="initPeer()">
    </div>
  </div>

  <!-- Header Bar -->
  <div class="hospital-header" id="sirenHeader">
    <div class="header-left">
      <svg class="header-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
        <defs>
          <radialGradient id="bgGrad2" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#3a005f"/>
            <stop offset="100%" stop-color="#0d0017"/>
          </radialGradient>
          <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
          <linearGradient id="shieldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff1744"/>
            <stop offset="100%" stop-color="#b20000"/>
          </linearGradient>
          <linearGradient id="pulseGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00e676"/>
            <stop offset="100%" stop-color="#b9f6ca"/>
          </linearGradient>
        </defs>
        <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#bgGrad2)" stroke="#3a005f" stroke-width="4"/>
        <path d="M250,90 L360,130 C360,260 250,350 250,370 C250,350 140,260 140,130 Z" fill="url(#shieldGrad2)" stroke="#ffffff" stroke-width="6" opacity="0.95" filter="url(#glow2)"/>
        <path d="M230,170 H270 V210 H310 V250 H270 V290 H230 V250 H190 V210 H230 Z" fill="#ffffff" opacity="0.25"/>
        <path d="M120,240 H190 L210,190 L235,280 L265,160 L290,260 L310,240 H380" fill="none" stroke="url(#pulseGrad2)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow2)"/>
      </svg>
      <div class="header-title-box">
        <h2>SEA Dashboard</h2>
        <small>SOS-EMERGENCY-ATTENDANCE CONTROL UNIT</small>
        <span id="hospitalStatusLabel" style="margin-top: 5px;">Status: Starting connection...</span>
      </div>
    </div>
    <button class="btn-stop" onclick="stopSiren()">STOP SIREN & ACKNOWLEDGE</button>
  </div>

  <!-- Main Layout -->
  <div class="hospital-layout">
    <div class="details-panel">
      <h3 style="color: var(--green); margin-top:0;">Emergency & Triage Info</h3>
      <div id="alertDetails">
        <p style="color: #888;">Monitoring live incoming SEA distress calls...</p>
      </div>
    </div>
    <div id="map"></div>
  </div>

  <script>
    let peer = null;
    let conn = null;
    let map = null;
    let mapMarker = null;
    let sirenInterval = null;
    let audioCtx = null;
    let oscillator = null;

    function initMap() {
      map = L.map('map').setView([20.5937, 78.9629], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);
    }

    function initPeer() {
      if (peer) peer.destroy();
      const channelId = document.getElementById('roomId').value.trim();

      peer = new Peer(channelId);
      
      peer.on('open', (id) => {
        document.getElementById('hospitalStatusLabel').innerText = "Status: Online & Listening for incoming SEA calls";
      });

      peer.on('connection', (connection) => {
        conn = connection;
        conn.on('data', (data) => {
          if (data.type === 'SOS_ALERT') {
            receiveSOS(data);
          }
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          document.getElementById('hospitalStatusLabel').innerText = "ID Taken! Change SEA Connection ID.";
        }
      });
    }

    function receiveSOS(data) {
      startSiren();

      document.getElementById('sirenHeader').classList.add('siren-active');
      document.getElementById('hospitalStatusLabel').innerText = "🚨 SEA EMERGENCY DISTRESS SIGNAL RECEIVED!";

      let locationHTML = "";
      if (data.lat && data.lng) {
        locationHTML = `
          <p><strong>GPS:</strong> ${data.lat.toFixed(4)}, ${data.lng.toFixed(4)}</p>
          <p><a href="https://www.google.com/maps?q=${data.lat},${data.lng}" target="_blank" style="color:var(--green); font-weight:bold;">Open in Google Maps ↗</a></p>
        `;
        const coords = [data.lat, data.lng];
        map.setView(coords, 16);

        if (mapMarker) map.removeLayer(mapMarker);
        mapMarker = L.marker(coords).addTo(map)
          .bindPopup(`<b>${data.name}</b><br>Blood Group: ${data.bloodGroup}<br>Phone: ${data.phone}`)
          .openPopup();
      } else {
        locationHTML = `<p style="color:var(--yellow);">⚠️ GPS Signal Unavailable (Relying on manual address)</p>`;
      }

      document.getElementById('alertDetails').innerHTML = `
        <p><strong>Time:</strong> ${data.time}</p>
        <p><strong>Name:</strong> ${data.name}</p>
        <p><strong>Phone:</strong> ${data.phone}</p>
        <p><strong>Blood Group:</strong> <span class="badge">${data.bloodGroup}</span></p>
        <hr style="border-color: var(--light-purple);">
        <p><strong>Manual Address:</strong><br><span style="color:#ffea00;">${data.manualAddress}</span></p>
        <hr style="border-color: var(--light-purple);">
        <p><strong>Known Allergies:</strong> ${data.allergies}</p>
        <p><strong>Pre-existing Conditions:</strong> ${data.conditions}</p>
        <p><strong>Emergency Contact:</strong> ${data.emergencyContact}</p>
        <hr style="border-color: var(--light-purple);">
        ${locationHTML}
      `;
    }

    function stopSiren() {
      if (oscillator) {
        oscillator.stop();
        oscillator = null;
      }
      document.getElementById('sirenHeader').classList.remove('siren-active');
      document.getElementById('hospitalStatusLabel').innerText = "Status: SEA Alert Acknowledged / Siren Stopped";

      if (conn && conn.open) {
        conn.send({ type: 'ACKNOWLEDGED' });
      }
    }

    function startSiren() {
      if (oscillator) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);

      let pitchToggle = false;
      sirenInterval = setInterval(() => {
        if (!oscillator) { clearInterval(sirenInterval); return; }
        oscillator.frequency.setValueAtTime(pitchToggle ? 600 : 900, audioCtx.currentTime);
        pitchToggle = !pitchToggle;
      }, 400);

      oscillator.connect(gain);
      gain.connect(audioCtx.destination);
      oscillator.start();
    }

    window.onload = () => {
      initMap();
      initPeer();
    };
  </script>
      <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
      </script>
      
</body>
</html>
