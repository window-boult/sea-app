<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEA - SOS Emergency Attendance System</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --purple: #1a002c;
      --card-bg: #270041;
      --light-purple: #3a005f;
      --green: #00e676;
      --yellow: #ffea00;
      --red: #ff1744;
      --white: #ffffff;
      --gray: #b0b0b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--purple);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .app-header {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-svg {
      width: 48px;
      height: 48px;
    }

    .app-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--green);
    }

    .view-pills {
      display: flex;
      background: var(--light-purple);
      padding: 4px;
      border-radius: 20px;
    }

    .pill-btn {
      background: none;
      border: none;
      color: var(--white);
      padding: 8px 16px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .pill-btn.active {
      background: var(--green);
      color: #000;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid var(--light-purple);
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 16px;
      font-size: 1.3rem;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--gray);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--light-purple);
      background: #150024;
      color: var(--white);
      font-size: 0.95rem;
    }

    .sos-radio-group {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    .sos-radio-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .sos-btn-wrapper {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    .sos-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff5252 0%, #b20000 100%);
      color: var(--white);
      border: 6px solid #ffffff;
      font-size: 2rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 23, 68, 0.8);
    }

    .sos-btn:active {
      transform: scale(0.94);
    }

    .status-msg {
      text-align: center;
      font-weight: 700;
      margin-top: 10px;
      font-size: 0.95rem;
      min-height: 24px;
    }

    .siren-header {
      padding: 12px;
      border-radius: 8px;
      background: var(--light-purple);
      text-align: center;
      margin-bottom: 16px;
    }

    .siren-header.siren-active {
      background: var(--red);
      animation: flash 0.8s infinite alternate;
    }

    @keyframes flash {
      from { opacity: 1; }
      to { opacity: 0.5; }
    }

    .ack-btn {
      width: 100%;
      padding: 12px;
      background: var(--yellow);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 16px;
    }

    #map {
      width: 100%;
      height: 250px;
      border-radius: 8px;
      margin-top: 16px;
    }

    .badge {
      background: var(--red);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal-card {
      background: var(--card-bg);
      width: 90%;
      max-width: 400px;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--light-purple);
    }

    .toggle-link {
      color: var(--green);
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
      margin-top: 12px;
      display: block;
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="logo-container">
      <svg class="logo-svg" viewBox="0 0 500 500">
        <defs>
          <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#3a005f"/>
            <stop offset="100%" stop-color="#0d0017"/>
          </radialGradient>
          <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff1744"/>
            <stop offset="100%" stop-color="#b20000"/>
          </linearGradient>
          <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00e676"/>
            <stop offset="100%" stop-color="#b9f6ca"/>
          </linearGradient>
        </defs>
        <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#bgGrad)" stroke="#3a005f" stroke-width="4"/>
        <path d="M250,70 L360,110 C360,240 250,330 250,350 C250,330 140,240 140,110 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="6" opacity="0.95"/>
        <path d="M120,220 H190 L210,170 L235,260 L265,140 L290,240 L310,220 H380" fill="none" stroke="url(#pulseGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="250" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="70" fill="#00e676" letter-spacing="4">SEA</text>
      </svg>
      <span class="app-title">SEA</span>
    </div>

    <div class="view-pills">
      <button id="pillPatient" class="pill-btn active" onclick="switchView('patient')">Patient</button>
      <button id="pillHospital" class="pill-btn" onclick="switchView('hospital')">Hospital</button>
    </div>
  </header>

  <!-- PATIENT PORTAL -->
  <main id="patientCard" class="card">
    <h2>Patient Emergency Profile</h2>
    
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="pName" placeholder="e.g. John Doe" value="John Doe" />
    </div>

    <div class="form-group">
      <label>Contact Phone</label>
      <input type="tel" id="pPhone" placeholder="e.g. 9876543210" value="9876543210" />
    </div>

    <div class="form-group">
      <label>Current Address / Landmark</label>
      <input type="text" id="pAddress" placeholder="e.g. 123 Main Street" value="123 Main Street" />
    </div>

    <div style="display: flex; gap: 12px;">
      <div class="form-group" style="flex:1;">
        <label>Blood Group</label>
        <select id="pBlood">
          <option value="O+" selected>O+</option>
          <option value="O-">O-</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
        </select>
      </div>

      <div class="form-group" style="flex:2;">
        <label>ICE Contact</label>
        <input type="tel" id="pICE" placeholder="Emergency Phone" value="9876543211" />
      </div>
    </div>

    <div class="form-group">
      <label>Severe Allergies</label>
      <input type="text" id="pAllergies" placeholder="e.g. Penicillin" value="Penicillin" />
    </div>

    <div class="form-group">
      <label>Pre-existing Conditions</label>
      <input type="text" id="pConditions" placeholder="e.g. Asthma" value="Asthma" />
    </div>

    <label style="margin-top: 10px;">Dispatch Action</label>
    <div class="sos-radio-group">
      <label class="sos-radio-label">
        <input type="radio" name="sosTarget" value="hospital" checked /> Alert Hospital Only
      </label>
      <label class="sos-radio-label">
        <input type="radio" name="sosTarget" value="both" /> Alert & Call 112
      </label>
    </div>

    <div class="sos-btn-wrapper">
      <button class="sos-btn" onclick="triggerSOS()">SOS</button>
    </div>

    <div id="patientStatus" class="status-msg"></div>
  </main>

  <!-- HOSPITAL DASHBOARD -->
  <main id="hospitalCard" class="card" style="display:none;">
    <div id="sirenHeader" class="siren-header">
      <h2 id="hStatus" style="margin:0;">Status: Monitoring Network</h2>
      <small id="activeHospitalName" style="color:var(--green); font-weight:bold;"></small>
    </div>

    <button class="ack-btn" onclick="stopSiren()">ACKNOWLEDGE & STOP SIREN</button>

    <div id="alertDetails" style="line-height: 1.6; font-size: 0.95rem;">
      <p style="color:var(--gray);">No active distress signal detected.</p>
    </div>

    <div id="map"></div>

    <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
      <span id="loggedInUserDisplay" style="font-size:0.8rem; color:var(--gray);"></span>
      <button onclick="logoutHospital()" style="background:none; border:none; color:var(--red); cursor:pointer; font-size:0.85rem; font-weight:bold;">Log Out</button>
    </div>
  </main>

  <!-- AUTHENTICATION MODAL FOR HOSPITAL -->
  <div id="loginModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <h2 id="modalTitle">Hospital Login</h2>
      
      <div id="signupFields" style="display:none;">
        <div class="form-group">
          <label>Hospital Facility Name</label>
          <input type="text" id="regHospName" placeholder="e.g. Central General Hospital" />
        </div>
      </div>

      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="Enter username" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Enter password" />
      </div>

      <div id="authMsg" style="color: var(--red); font-size: 0.85rem; margin-bottom: 10px; display: none;"></div>

      <button id="authSubmitBtn" class="btn-submit" onclick="handleAuthSubmit()">Login</button>
      <span id="toggleAuthMode" class="toggle-link" onclick="toggleAuthMode()">Don't have an account? Register Hospital</span>
      <span class="toggle-link" style="color: var(--gray); text-decoration: none;" onclick="switchView('patient')">Cancel</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const SHARED_CHANNEL = "sea_emergency_channel_prod_99";

    let authenticatedUser = null;
    let isRegisterMode = false;
    let map = null, mapMarker = null, accuracyCircle = null;
    let audioCtx = null, oscillator = null, sirenInterval = null;
    let gpsWatchId = null, locationFallbackInterval = null;
    let processedMessageIds = new Set();
    let latestCoords = { lat: null, lng: null, accuracy: null };

    function startPollingListener() {
      setInterval(async () => {
        try {
          const res = await fetch(`https://ntfy.sh/${SHARED_CHANNEL}/json?poll=1&since=30s`);
          if (!res.ok) return;
          
          const rawText = await res.text();
          const lines = rawText.trim().split('\n');
          
          for (let line of lines) {
            if (!line) continue;
            try {
              const item = JSON.parse(line);
              if (item && item.id && !processedMessageIds.has(item.id) && item.message) {
                const data = JSON.parse(item.message);
                if (data.type === 'SOS_ALERT') {
                  processedMessageIds.add(item.id);
                  receiveSOS(data);
                }
              }
            } catch(e) {}
          }
        } catch (e) {}
      }, 2000);
    }

    startPollingListener();

    function getStoredAccounts() {
      const accounts = localStorage.getItem('sea_hospital_accounts');
      if (accounts) return JSON.parse(accounts);
      return [{ name: "Central General Hospital", user: "skim hospital", pass: "skim123" }];
    }

    function saveAccounts(accounts) {
      localStorage.setItem('sea_hospital_accounts', JSON.stringify(accounts));
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      const modalTitle = document.getElementById('modalTitle');
      const signupFields = document.getElementById('signupFields');
      const submitBtn = document.getElementById('authSubmitBtn');
      const toggleLink = document.getElementById('toggleAuthMode');
      const msg = document.getElementById('authMsg');

      msg.style.display = 'none';

      if (isRegisterMode) {
        modalTitle.innerText = "Register Hospital";
        signupFields.style.display = "block";
        submitBtn.innerText = "Register & Login";
        toggleLink.innerText = "Already registered? Log in here";
      } else {
        modalTitle.innerText = "Hospital Login";
        signupFields.style.display = "none";
        submitBtn.innerText = "Login";
        toggleLink.innerText = "Don't have an account? Register Hospital";
      }
    }

    function handleAuthSubmit() {
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value.trim();
      const msg = document.getElementById('authMsg');

      if (!u || !p) {
        msg.innerText = "Please enter both username and password!";
        msg.style.color = "var(--red)";
        msg.style.display = "block";
        return;
      }

      const accounts = getStoredAccounts();

      if (isRegisterMode) {
        const hName = document.getElementById('regHospName').value.trim();
        if (!hName) {
          msg.innerText = "Please enter your Hospital Name!";
          msg.style.color = "var(--red)";
          msg.style.display = "block";
          return;
        }

        const existing = accounts.find(a => a.user.toLowerCase() === u.toLowerCase());
        if (existing) {
          msg.innerText = "Username already exists!";
          msg.style.color = "var(--red)";
          msg.style.display = "block";
          return;
        }

        const newAcc = { name: hName, user: u, pass: p };
        accounts.push(newAcc);
        saveAccounts(accounts);
        authenticatedUser = newAcc;
        openDashboard();
      } else {
        const matched = accounts.find(a => a.user.toLowerCase() === u.toLowerCase() && a.pass === p);
        if (matched) {
          authenticatedUser = matched;
          openDashboard();
        } else {
          msg.innerText = "Invalid credentials!";
          msg.style.color = "var(--red)";
          msg.style.display = "block";
        }
      }
    }

    function openDashboard() {
      document.getElementById('loginModal').style.display = 'none';
      document.getElementById('patientCard').style.display = 'none';
      document.getElementById('hospitalCard').style.display = 'block';
      document.getElementById('pillHospital').classList.add('active');
      document.getElementById('pillPatient').classList.remove('active');

      document.getElementById('activeHospitalName').innerText = authenticatedUser.name;
      document.getElementById('loggedInUserDisplay').innerText = `Logged in as: ${authenticatedUser.user}`;
      
      initMap();
    }

    function logoutHospital() {
      authenticatedUser = null;
      stopSiren();
      switchView('patient');
    }

    function switchView(target) {
      if (target === 'patient') {
        document.getElementById('patientCard').style.display = 'block';
        document.getElementById('hospitalCard').style.display = 'none';
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('pillPatient').classList.add('active');
        document.getElementById('pillHospital').classList.remove('active');
      } else if (target === 'hospital') {
        if (!authenticatedUser) {
          document.getElementById('loginModal').style.display = 'flex';
        } else {
          openDashboard();
        }
      }
    }

    function sendSOSPayload(lat, lng, accuracy) {
      const status = document.getElementById('patientStatus');
      const nameVal = document.getElementById('pName').value.trim() || "Unknown";
      const phoneVal = document.getElementById('pPhone').value.trim() || "Not Provided";
      const addressVal = document.getElementById('pAddress').value.trim() || "Not Provided";
      const bloodVal = document.getElementById('pBlood').value || "Unknown";
      const iceVal = document.getElementById('pICE').value.trim() || "Not Provided";
      const allergiesVal = document.getElementById('pAllergies').value.trim() || "None Listed";
      const conditionsVal = document.getElementById('pConditions').value.trim() || "None Listed";

      const payload = {
        type: 'SOS_ALERT',
        name: nameVal,
        phone: phoneVal,
        address: addressVal,
        blood: bloodVal,
        ice: iceVal,
        allergies: allergiesVal,
        conditions: conditionsVal,
        lat: lat,
        lng: lng,
        accuracy: accuracy,
        time: new Date().toLocaleTimeString()
      };

      fetch(`https://ntfy.sh/${SHARED_CHANNEL}`, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      }).then(() => {
        status.innerText = "🚨 DISTRESS SIGNAL TRANSMITTED!";
        status.style.color = "var(--green)";
      }).catch(err => {
        status.innerText = "⚠️ Transmission retry in progress...";
        status.style.color = "var(--yellow)";
      });
    }

    function triggerSOS() {
      const status = document.getElementById('patientStatus');
      status.innerText = "🚨 Transmitting Distress Signal...";
      status.style.color = "var(--yellow)";

      const selectedTarget = document.querySelector('input[name="sosTarget"]:checked').value;

      sendSOSPayload(latestCoords.lat, latestCoords.lng, latestCoords.accuracy);

      if (selectedTarget === 'both') {
        window.location.href = "tel:112";
      }

      if ("geolocation" in navigator) {
        if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
        if (locationFallbackInterval) clearInterval(locationFallbackInterval);

        gpsWatchId = navigator.geolocation.watchPosition(
          (pos) => {
            latestCoords = {
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              accuracy: pos.coords.accuracy
            };
            sendSOSPayload(latestCoords.lat, latestCoords.lng, latestCoords.accuracy);
          },
          (err) => {
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                latestCoords = {
                  lat: pos.coords.latitude,
                  lng: pos.coords.longitude,
                  accuracy: pos.coords.accuracy
                };
                sendSOSPayload(latestCoords.lat, latestCoords.lng, latestCoords.accuracy);
              },
