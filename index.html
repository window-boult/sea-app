<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEA - SOS Emergency Attendance System</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg-dark: #0d0017;
      --card-bg: #1a002c;
      --accent-red: #ff1744;
      --accent-green: #00e676;
      --text-light: #ffffff;
      --text-sub: #b3b3b3;
      --border-color: #3a005f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .header-logo {
      text-align: center;
      margin-bottom: 15px;
    }

    /* Fixed logo size rendering for PC browsers */
    .app-logo {
      width: 80px;
      height: 80px;
      min-width: 80px;
      min-height: 80px;
      margin: 0 auto 5px auto;
      display: block;
    }

    h1.title {
      font-size: 24px;
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-sub);
    }

    .mode-toggle {
      display: flex;
      background: #0d0017;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .mode-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .mode-btn.active {
      background: var(--accent-green);
      color: var(--bg-dark);
    }

    .view-panel {
      display: none;
    }

    .view-panel.active {
      display: block;
    }

    .sos-button {
      width: 100%;
      padding: 20px;
      background: linear-gradient(135deg, #ff1744, #b20000);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 23, 68, 0.5);
      margin-bottom: 15px;
      transition: transform 0.1s, box-shadow 0.3s;
    }

    .sos-button:active {
      transform: scale(0.98);
    }

    .call-btn {
      width: 100%;
      padding: 12px;
      background: #2979ff;
      color: white;
      text-align: center;
      text-decoration: none;
      display: block;
      border-radius: 10px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      background: #0d0017;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: white;
      font-size: 14px;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-green);
    }

    .status-banner {
      padding: 12px;
      border-radius: 10px;
      background: #2a0000;
      border: 1px solid #ff1744;
      color: #ff1744;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
      display: none;
    }

    .status-banner.alerting {
      display: block;
      animation: flashSiren 0.8s infinite alternate;
    }

    @keyframes flashSiren {
      from { background: #2a0000; border-color: #ff1744; }
      to { background: #800000; border-color: #ffffff; color: #ffffff; }
    }

    #map {
      width: 100%;
      height: 250px;
      border-radius: 12px;
      margin-top: 15px;
      border: 1px solid var(--border-color);
    }

    .ack-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-green);
      color: var(--bg-dark);
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 15px;
      display: none;
    }

    .ack-btn.visible {
      display: block;
    }

    .details-card {
      background: #0d0017;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.6;
    }

    .details-card strong {
      color: var(--accent-green);
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header-logo">
    <svg class="app-logo" width="80" height="80" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
      <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#3a005f"/>
          <stop offset="100%" stop-color="#0d0017"/>
        </radialGradient>
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff1744"/>
          <stop offset="100%" stop-color="#b20000"/>
        </linearGradient>
        <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00e676"/>
          <stop offset="100%" stop-color="#b9f6ca"/>
        </linearGradient>
      </defs>
      <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#bgGrad)" stroke="#3a005f" stroke-width="4"/>
      <path d="M250,70 L360,110 C360,240 250,330 250,350 C250,330 140,240 140,110 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="6" opacity="0.95"/>
      <path d="M120,220 H190 L210,170 L235,260 L265,140 L290,240 L310,220 H380" fill="none" stroke="url(#pulseGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="250" y="420" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="70" fill="#00e676" letter-spacing="4">SEA</text>
    </svg>
    <h1 class="title">SEA SYSTEM</h1>
    <div class="subtitle">SOS Emergency Attendance & Control Network</div>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="patientTabBtn" onclick="switchView('patient')">Patient Portal</button>
    <button class="mode-btn" id="hospitalTabBtn" onclick="switchView('hospital')">Hospital Dashboard</button>
  </div>

  <!-- PATIENT PORTAL -->
  <div id="patientCard" class="view-panel active">
    <button class="sos-button" onclick="triggerSOS()">🚨 TRIGGER SOS 🚨</button>
    <a href="tel:112" class="call-btn">📞 CALL EMERGENCY SERVICES (112)</a>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="pName" class="form-control" placeholder="John Doe">
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="pPhone" class="form-control" placeholder="+91 9876543210">
    </div>
    <div class="form-group">
      <label>Blood Group</label>
      <select id="pBlood" class="form-control">
        <option value="Unknown">Select Blood Group</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
      </select>
    </div>
    <div class="form-group">
      <label>Emergency Contact (ICE Phone)</label>
      <input type="tel" id="pIce" class="form-control" placeholder="+91 9123456789">
    </div>
    <div class="form-group">
      <label>Known Allergies</label>
      <input type="text" id="pAllergies" class="form-control" placeholder="Penicillin, Peanuts (or None)">
    </div>
    <div class="form-group">
      <label>Medical Conditions</label>
      <input type="text" id="pConditions" class="form-control" placeholder="Asthma, Diabetes (or None)">
    </div>
    <div class="form-group">
      <label>Manual Address / Location Remarks</label>
      <input type="text" id="pAddress" class="form-control" placeholder="Building/Street Details">
    </div>
  </div>

  <!-- HOSPITAL DASHBOARD -->
  <div id="hospitalCard" class="view-panel">
    <div id="statusBanner" class="status-banner">🚨 INCOMING DISTRESS SIGNAL DETECTED 🚨</div>
    
    <div class="details-card" id="alertDetails">
      <em>Waiting for emergency distress signals... Dashboard polling active.</em>
    </div>

    <div id="map"></div>

    <button id="ackBtn" class="ack-btn" onclick="acknowledgeSiren()">ACKNOWLEDGE & STOP SIREN</button>
  </div>
</div>

<script>
  const MY_DEVICE_ID = 'DEVICE_' + Math.random().toString(36).substring(2, 11);
  const RELAY_URL = 'https://ntfy.sh/sea_emergency_network_global_v1';

  let map = null;
  let patientMarker = null;
  let accuracyCircle = null;
  let audioCtx = null;
  let osc = null;
  let gainNode = null;
  let sirenInterval = null;
  let isAlerting = false;

  function switchView(view) {
    document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.mode-btn').forEach(el => el.classList.remove('active'));
    
    if (view === 'patient') {
      document.getElementById('patientCard').classList.add('active');
      document.getElementById('patientTabBtn').classList.add('active');
    } else {
      document.getElementById('hospitalCard').classList.add('active');
      document.getElementById('hospitalTabBtn').classList.add('active');
      initMap();
    }
  }

  function initMap() {
    if (map) return;
    map = L.map('map').setView([8.52413, 76.93663], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);
  }

  function triggerSOS() {
    if (!navigator.geolocation) {
      alert("Geolocation is not supported by your browser.");
      sendPayload(0, 0, 0);
      return;
    }

    navigator.geolocation.watchPosition(
      (pos) => {
        sendPayload(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
      },
      (err) => {
        alert("GPS Signal Unavailable. Transmitting manual form details.");
        sendPayload(0, 0, 0);
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  function sendPayload(lat, lng, accuracy) {
    const payload = {
      type: "SOS_ALERT",
      senderId: MY_DEVICE_ID,
      name: document.getElementById('pName').value || "Anonymous Patient",
      phone: document.getElementById('pPhone').value || "N/A",
      address: document.getElementById('pAddress').value || "GPS Location Transmitted",
      blood: document.getElementById('pBlood').value || "Unknown",
      ice: document.getElementById('pIce').value || "N/A",
      allergies: document.getElementById('pAllergies').value || "None Reported",
      conditions: document.getElementById('pConditions').value || "None Reported",
      lat: lat,
      lng: lng,
      accuracy: accuracy,
      time: new Date().toLocaleTimeString()
    };

    fetch(RELAY_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(() => alert("SOS Signal Transmitted Successfully to Hospital Network!"))
    .catch(() => alert("Relay error. Check internet connection."));
  }

  setInterval(() => {
    fetch(RELAY_URL + '/json?poll=1&since=30s')
      .then(res => res.text())
      .then(text => {
        const lines = text.trim().split('\n');
        lines.forEach(line => {
          if (!line) return;
          try {
            const msg = JSON.parse(line);
            if (msg.message) {
              const data = JSON.parse(msg.message);
              if (data.type === "SOS_ALERT" && data.senderId !== MY_DEVICE_ID) {
                processIncomingSOS(data);
              }
            }
          } catch (e) {}
        });
      })
      .catch(() => {});
  }, 3000);

  function processIncomingSOS(data) {
    if (isAlerting) return;
    isAlerting = true;

    document.getElementById('statusBanner').classList.add('alerting');
    document.getElementById('ackBtn').classList.add('visible');

    document.getElementById('alertDetails').innerHTML = `
      <strong>Patient:</strong> ${data.name}<br>
      <strong>Phone:</strong> ${data.phone}<br>
      <strong>Blood Group:</strong> ${data.blood}<br>
      <strong>ICE Contact:</strong> ${data.ice}<br>
      <strong>Allergies:</strong> ${data.allergies}<br>
      <strong>Conditions:</strong> ${data.conditions}<br>
      <strong>Address / Remarks:</strong> ${data.address}<br>
      <strong>Time:</strong> ${data.time}
    `;

    if (data.lat && data.lng) {
      initMap();
      const pos = [data.lat, data.lng];
      map.setView(pos, 16);

      if (patientMarker) map.removeLayer(patientMarker);
      if (accuracyCircle) map.removeLayer(accuracyCircle);

      patientMarker = L.marker(pos).addTo(map).bindPopup(`<b>${data.name}</b><br>SOS Location`).openPopup();
      
      if (data.accuracy) {
        accuracyCircle = L.circle(pos, {
          radius: data.accuracy,
          color: '#ff1744',
          fillColor: '#ff1744',
          fillOpacity: 0.3
        }).addTo(map);
      }
    }

    startSiren();
  }

  function startSiren() {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      osc = audioCtx.createOscillator();
      gainNode = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);

      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();

      let highPitch = false;
      sirenInterval = setInterval(() => {
        if (!osc || !audioCtx) return;
        osc.frequency.setValueAtTime(highPitch ? 600 : 900, audioCtx.currentTime);
        highPitch = !highPitch;
      }, 400);
    } catch (e) {
      console.log("Audio play blocked by browser. Click page to allow.");
    }
  }

  function acknowledgeSiren() {
    isAlerting = false;
    document.getElementById('statusBanner').classList.remove('alerting');
    document.getElementById('ackBtn').classList.remove('visible');

    if (sirenInterval) clearInterval(sirenInterval);
    if (gainNode && audioCtx) gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    if (osc) {
      try { osc.stop(); osc.disconnect(); } catch (e) {}
    }
    if (audioCtx) {
      try { audioCtx.close(); } catch (e) {}
    }
  }
</script>

</body>
</html>
