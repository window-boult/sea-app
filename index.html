<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Emergency Dispatch Host</title>
  
  <!-- Leaflet Maps CSS & JS (Free OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- PeerJS for Instant Device-to-Device WebRTC Connection -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --purple: #1a002c;
      --light-purple: #3a005f;
      --green: #00e676;
      --red: #ff1744;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 15px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--purple);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hospital-header {
      background: var(--light-purple);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid var(--green);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .siren-active {
      animation: flashSiren 0.5s infinite alternate;
    }
    @keyframes flashSiren {
      0% { background-color: var(--light-purple); box-shadow: 0 0 10px var(--green); }
      100% { background-color: #990000; box-shadow: 0 0 40px var(--red); }
    }

    .btn-stop {
      background: var(--green);
      color: #000;
      font-weight: bold;
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }

    .channel-id-box {
      background: #0d0017;
      border: 1px solid var(--light-purple);
      padding: 8px 12px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 15px;
    }

    .hospital-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      flex: 1;
    }
    @media (min-width: 768px) {
      .hospital-layout { grid-template-columns: 320px 1fr; }
    }

    .details-panel {
      background: #0d0017;
      border: 1px solid var(--light-purple);
      border-radius: 12px;
      padding: 20px;
    }

    #map {
      height: 100%;
      min-height: 400px;
      border-radius: 12px;
      border: 2px solid var(--green);
    }
  </style>
</head>
<body>

  <!-- Channel ID Setting Bar -->
  <div>
    <div class="channel-id-box">
      <label>Hospital Connection ID: </label>
      <input type="text" id="roomId" value="hospital-sos-99" style="padding:4px 8px; background:#1a002c; color:white; border:1px solid var(--light-purple); border-radius:4px;" onchange="initPeer()">
    </div>
  </div>

  <!-- Main Hospital Header Bar -->
  <div class="hospital-header" id="sirenHeader">
    <div>
      <h2 style="margin:0;">🏥 Hospital Dispatch Dashboard</h2>
      <span id="hospitalStatusLabel">Status: Starting connection...</span>
    </div>
    <button class="btn-stop" onclick="stopSiren()">STOP SIREN & ACKNOWLEDGE</button>
  </div>

  <!-- Dashboard Layout -->
  <div class="hospital-layout">
    <div class="details-panel">
      <h3 style="color: var(--green); margin-top:0;">Emergency Details</h3>
      <div id="alertDetails">
        <p style="color: #888;">Monitoring live incoming distress calls...</p>
      </div>
    </div>
    <div id="map"></div>
  </div>

  <script>
    let peer = null;
    let conn = null;
    let map = null;
    let mapMarker = null;
    let sirenInterval = null;
    let audioCtx = null;
    let oscillator = null;

    function initMap() {
      map = L.map('map').setView([20.5937, 78.9629], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);
    }

    function initPeer() {
      if (peer) peer.destroy();
      const channelId = document.getElementById('roomId').value.trim();

      peer = new Peer(channelId);
      
      peer.on('open', (id) => {
        document.getElementById('hospitalStatusLabel').innerText = "Status: Online & Listening for incoming SOS calls";
      });

      peer.on('connection', (connection) => {
        conn = connection;
        conn.on('data', (data) => {
          if (data.type === 'SOS_ALERT') {
            receiveSOS(data);
          }
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          document.getElementById('hospitalStatusLabel').innerText = "ID Taken! Change Hospital Connection ID.";
        }
      });
    }

    function receiveSOS(data) {
      startSiren();

      document.getElementById('sirenHeader').classList.add('siren-active');
      document.getElementById('hospitalStatusLabel').innerText = "🚨 EMERGENCY DISTRESS SIGNAL RECEIVED!";

      document.getElementById('alertDetails').innerHTML = `
        <p><strong>Name:</strong> ${data.name}</p>
        <p><strong>Phone:</strong> ${data.phone}</p>
        <p><strong>Notes:</strong> ${data.notes}</p>
        <p><strong>Time:</strong> ${data.time}</p>
        <p><strong>GPS:</strong> ${data.lat.toFixed(4)}, ${data.lng.toFixed(4)}</p>
        <p><a href="https://www.google.com/maps?q=${data.lat},${data.lng}" target="_blank" style="color:var(--green); font-weight:bold;">Open in Google Maps ↗</a></p>
      `;

      const coords = [data.lat, data.lng];
      map.setView(coords, 16);

      if (mapMarker) map.removeLayer(mapMarker);
      mapMarker = L.marker(coords).addTo(map)
        .bindPopup(`<b>${data.name}</b><br>${data.phone}`)
        .openPopup();
    }

    function stopSiren() {
      if (oscillator) {
        oscillator.stop();
        oscillator = null;
      }
      document.getElementById('sirenHeader').classList.remove('siren-active');
      document.getElementById('hospitalStatusLabel').innerText = "Status: Alert Acknowledged / Siren Stopped";

      if (conn && conn.open) {
        conn.send({ type: 'ACKNOWLEDGED' });
      }
    }

    function startSiren() {
      if (oscillator) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);

      let pitchToggle = false;
      sirenInterval = setInterval(() => {
        if (!oscillator) { clearInterval(sirenInterval); return; }
        oscillator.frequency.setValueAtTime(pitchToggle ? 600 : 900, audioCtx.currentTime);
        pitchToggle = !pitchToggle;
      }, 400);

      oscillator.connect(gain);
      gain.connect(audioCtx.destination);
      oscillator.start();
    }

    window.onload = () => {
      initMap();
      initPeer();
    };
  </script>
</body>
</html>
