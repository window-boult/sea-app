<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEA Hospital Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0a0a0c;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 30px;
    }

    .header {
      display: flex;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #222;
      margin-bottom: 30px;
    }

    .header img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      margin-right: 15px;
    }

    .header h1 {
      font-size: 24px;
      color: #00e676;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background-color: #141419;
      border: 1px solid #282830;
      border-radius: 12px;
      padding: 20px;
    }

    .card h2 {
      font-size: 16px;
      color: #888899;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background-color: #222;
      color: #888;
      font-size: 14px;
      font-weight: bold;
    }

    .status-badge.active {
      background-color: #ff1744;
      color: #ffffff;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .data-field {
      font-size: 18px;
      margin-top: 10px;
      font-family: monospace;
      color: #00e676;
    }

    a.map-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 18px;
      background-color: #2979ff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="logo.png" alt="SEA Logo" onerror="this.style.display='none'">
    <h1>SEA Hospital Emergency Control Dashboard</h1>
  </div>

  <div class="dashboard-grid">
    <div class="card">
      <h2>Alert System Status</h2>
      <div id="signal-status" class="status-badge">AWAITING PATIENT SIGNAL</div>
      <div id="signal-time" class="data-field" style="color: #888;">No signals received yet.</div>
    </div>

    <div class="card">
      <h2>Patient GPS Location</h2>
      <div id="gps-coords" class="data-field">--.------, --.------</div>
      <div id="map-link-container"></div>
    </div>
  </div>

  <script>
    // Listen for real-time emergency events transmitted from client.html
    window.addEventListener("storage", function(event) {
      if (event.key === "sea_emergency_signal" && event.newValue) {
        const data = JSON.parse(event.newValue);
        
        // Update Status
        const statusBadge = document.getElementById("signal-status");
        statusBadge.innerText = data.status;
        statusBadge.classList.add("active");

        // Update Time
        document.getElementById("signal-time").innerText = "Received at: " + data.time;

        // Update Coordinates
        const coordsText = `Lat: ${data.latitude}, Lng: ${data.longitude}`;
        document.getElementById("gps-coords").innerText = coordsText;

        // Generate Google Maps Direct Navigation Link
        const mapsUrl = `https://www.google.com/maps?q=${data.latitude},${data.longitude}`;
        document.getElementById("map-link-container").innerHTML = `
          <a href="${mapsUrl}" target="_blank" class="map-btn">📍 Open Location in Google Maps</a>
        `;
      }
    });
  </script>
</body>
</html>
